```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Moresh Sir ke Notes - Information Technology notes for Class XI and XII."
    >

    <meta name="theme-color" content="#315F63">

    <title>Page Not Found | Moresh Sir ke Notes</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <style>
        :root {
            --primary: #315F63;
            --primary-dark: #274D50;
            --cream: #F7F7F3;
            --white: #FFFFFF;
            --text: #243335;
            --muted: #687779;
            --accent: #C7955B;
            --border: #E3E6E2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(49, 95, 99, 0.07),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(199, 149, 91, 0.07),
                    transparent 28%
                ),
                var(--cream);
        }

        .error-card {
            width: min(100%, 620px);
            text-align: center;

            padding: 56px 36px;

            background: rgba(255, 255, 255, 0.82);
            border: 1px solid var(--border);
            border-radius: 28px;

            box-shadow:
                0 20px 60px rgba(36, 51, 53, 0.08);

            backdrop-filter: blur(10px);
        }

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 28px;

            display: grid;
            place-items: center;

            border-radius: 18px;

            background: var(--primary);
            color: white;

            font-size: 21px;
            font-weight: 750;
            letter-spacing: -0.04em;
        }

        .error-number {
            display: block;

            margin-bottom: 10px;

            color: var(--accent);

            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 16px;

            color: var(--primary-dark);

            font-size: clamp(32px, 6vw, 48px);
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        .message {
            max-width: 480px;
            margin: 0 auto 30px;

            color: var(--muted);

            font-size: 17px;
            line-height: 1.7;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            min-height: 48px;
            padding: 0 22px;

            border-radius: 12px;

            background: var(--primary);
            color: white;

            font-size: 15px;
            font-weight: 650;

            text-decoration: none;

            transition:
                background 180ms ease,
                transform 180ms ease,
                box-shadow 180ms ease;
        }

        .home-button:hover {
            background: var(--primary-dark);

            transform: translateY(-2px);

            box-shadow:
                0 10px 24px rgba(49, 95, 99, 0.18);
        }

        .home-button:focus-visible {
            outline: 3px solid rgba(199, 149, 91, 0.45);
            outline-offset: 4px;
        }

        .footer-note {
            margin-top: 28px;

            color: #899394;

            font-size: 13px;
        }

        @media (max-width: 520px) {
            .error-card {
                padding: 44px 22px;
                border-radius: 22px;
            }

            .logo {
                width: 56px;
                height: 56px;
                border-radius: 16px;
            }

            .message {
                font-size: 16px;
            }

            .home-button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .home-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="error-card">

        <div class="logo" aria-hidden="true">
            MS
        </div>

        <span class="error-number">
            Page 404
        </span>

        <h1>
            This page isn't in the notes.
        </h1>

        <p class="message">
            Looks like the page you're looking for has moved
            or doesn't exist. Don't worry — your notes are still here.
        </p>

        <a
            class="home-button"
            href="./"
            aria-label="Go back to Moresh Sir ke Notes homepage"
        >
            ← Back to Notes
        </a>

        <p class="footer-note">
            Moresh Sir ke Notes · IT for Class XI & XII
        </p>

    </main>

</body>
</html>
